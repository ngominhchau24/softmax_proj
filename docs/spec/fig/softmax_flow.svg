<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 330" width="1420" height="330" font-family="Arial, Helvetica, sans-serif" fill="#000">
<title>softmax_flow</title>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L7.5,4 L0,7.2 z" fill="#000"/></marker></defs>
<rect width="1420" height="330" fill="#fff"/>
<rect x="40" y="100" width="90" height="60" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="85" y="127" font-size="13" text-anchor="middle">X_BUF</text>
<text x="85" y="143" font-size="11" text-anchor="middle">q</text>
<rect x="210" y="100" width="140" height="60" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="280" y="127" font-size="13" text-anchor="middle">u = q K</text>
<text x="280" y="143" font-size="11" text-anchor="middle">c = ceil(u)</text>
<rect x="450" y="40" width="140" height="60" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="520" y="67" font-size="13" text-anchor="middle">M, dM</text>
<text x="520" y="83" font-size="11" text-anchor="middle">pass 1 only</text>
<rect x="450" y="170" width="140" height="60" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="520" y="197" font-size="13" text-anchor="middle">E = 2^d</text>
<text x="520" y="213" font-size="11" text-anchor="middle">d = u - M</text>
<rect x="720" y="60" width="190" height="60" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="815" y="94" font-size="13" text-anchor="middle">sum = (sum &gt;&gt; dM) + E</text>
<rect x="1020" y="60" width="140" height="60" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="1090" y="94" font-size="13" text-anchor="middle">Rcp = 2^40 / sum</text>
<rect x="1020" y="190" width="190" height="60" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="1115" y="224" font-size="13" text-anchor="middle">y = (E Rcp + 2^31) &gt;&gt; 32</text>
<rect x="1290" y="190" width="90" height="60" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="1335" y="217" font-size="13" text-anchor="middle">Y_BUF</text>
<text x="1335" y="233" font-size="11" text-anchor="middle">y</text>
<polyline points="130,130 210,130" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="135" y="125" font-size="11" text-anchor="start">q[7:0]</text>
<polyline points="350,110 400,110 400,70 450,70" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="405" y="94" font-size="11" text-anchor="start">c[8:0]</text>
<polyline points="350,150 400,150 400,200 450,200" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="405" y="179" font-size="11" text-anchor="start">u[24:0]</text>
<polyline points="520,100 520,170" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="525" y="139" font-size="11" text-anchor="start">M[8:0]</text>
<polyline points="590,70 720,70" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="595" y="65" font-size="11" text-anchor="start">dM[7:0]</text>
<polyline points="590,190 660,190 660,110 720,110" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="665" y="154" font-size="11" text-anchor="start">E[15:0], pass 1</text>
<polyline points="910,90 1020,90" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="915" y="85" font-size="11" text-anchor="start">sum[24:0]</text>
<polyline points="1090,120 1090,190" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="1095" y="159" font-size="11" text-anchor="start">Rcp[26:0]</text>
<polyline points="590,210 1020,210" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="595" y="205" font-size="11" text-anchor="start">E[15:0], pass 2</text>
<polyline points="1210,220 1290,220" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="1215" y="215" font-size="11" text-anchor="start">y[7:0]</text>
</svg>
