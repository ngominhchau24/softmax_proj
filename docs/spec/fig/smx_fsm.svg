<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" width="1100" height="340" font-family="Arial, Helvetica, sans-serif" fill="#000">
<title>smx_fsm</title>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L7.5,4 L0,7.2 z" fill="#000"/></marker></defs>
<rect width="1100" height="340" fill="#fff"/>
<rect x="200" y="60" width="120" height="60" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="260" y="94" font-size="13" text-anchor="middle">IDLE</text>
<rect x="440" y="60" width="120" height="60" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="500" y="87" font-size="13" text-anchor="middle">P1_RUN</text>
<text x="500" y="103" font-size="11" text-anchor="middle">issue groups</text>
<rect x="680" y="60" width="120" height="60" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="740" y="94" font-size="13" text-anchor="middle">P1_DRAIN</text>
<rect x="920" y="60" width="120" height="60" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="980" y="87" font-size="13" text-anchor="middle">DIV</text>
<text x="980" y="103" font-size="11" text-anchor="middle">div_start = 1</text>
<rect x="920" y="240" width="120" height="60" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="980" y="274" font-size="13" text-anchor="middle">DIV_WAIT</text>
<rect x="680" y="240" width="120" height="60" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="740" y="267" font-size="13" text-anchor="middle">P2_RUN</text>
<text x="740" y="283" font-size="11" text-anchor="middle">issue groups</text>
<rect x="440" y="240" width="120" height="60" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="500" y="274" font-size="13" text-anchor="middle">P2_DRAIN</text>
<rect x="200" y="240" width="120" height="60" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="260" y="274" font-size="13" text-anchor="middle">NEXT_ROW</text>
<polyline points="130,90 200,90" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="135" y="85" font-size="11" text-anchor="start">reset</text>
<polyline points="320,90 440,90" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="325" y="85" font-size="11" text-anchor="start">start / r = 0</text>
<polyline points="560,90 680,90" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="565" y="85" font-size="11" text-anchor="start">last group issued</text>
<polyline points="800,90 920,90" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="805" y="85" font-size="11" text-anchor="start">sum_last</text>
<polyline points="980,120 980,240" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="985" y="184" font-size="11" text-anchor="start">one cycle</text>
<polyline points="920,270 800,270" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="805" y="265" font-size="11" text-anchor="start">div_done</text>
<polyline points="680,270 560,270" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="565" y="265" font-size="11" text-anchor="start">last group issued</text>
<polyline points="440,270 320,270" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="325" y="265" font-size="11" text-anchor="start">y_last</text>
<polyline points="230,240 230,120" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="225" y="184" font-size="11" text-anchor="end">r + 1 == R / run_done = 1</text>
<polyline points="280,240 280,180 500,180 500,120" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="285" y="175" font-size="11" text-anchor="start">r + 1 &lt; R / r = r + 1</text>
</svg>
