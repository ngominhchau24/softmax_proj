<text x="25" y="145" font-size="11" text-anchor="start">wr_addr[9:0]</text>
<circle cx="430" cy="150" r="2.8" fill="#000"/>
<polyline points="430,150 430,250 480,250" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
<polyline points="20,190 400,190 400,120 480,120" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="25" y="185" font-size="11" text-anchor="start">wr_data[63:0]</text>
<circle cx="400" cy="190" r="2.8" fill="#000"/>
<polyline points="400,190 400,270 480,270" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
<polyline points="20,340 700,340 700,100 660,100" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="25" y="335" font-size="11" text-anchor="start">rd_addr[9:0]</text>
<circle cx="570" cy="340" r="2.8" fill="#000"/>
