<text x="570" y="262" font-size="13" text-anchor="middle">mem[0:1023][7:0]</text>
<text x="570" y="278" font-size="11" text-anchor="middle">g_bank[1].g_byte[3]</text>
<text x="470" y="180" font-size="11" text-anchor="start">... 8 RAMs, one per bank and byte ...</text>
