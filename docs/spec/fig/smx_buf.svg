<rect width="1060" height="440" fill="#fff"/>
<rect x="150" y="20" width="760" height="390" fill="none" stroke="#000" stroke-width="1.2" stroke-dasharray="7 4"/>
<text x="158" y="402" font-size="11" text-anchor="start">smx_buf</text>
<rect x="190" y="60" width="100" height="70" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="240" y="92" font-size="13" text-anchor="middle">write enable</text>
<text x="240" y="108" font-size="11" text-anchor="middle">wr_en[b] &amp; wr_be[i]</text>
