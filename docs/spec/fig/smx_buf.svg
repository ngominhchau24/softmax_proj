<text x="930" y="255" font-size="11" text-anchor="start">rd_data[63:56]</text>
<text x="360" y="376" font-size="11" text-anchor="start">Byte i of bank b writes wr_data[8(4b+i)+7 : 8(4b+i)].</text>
<text x="360" y="396" font-size="11" text-anchor="start">Read is registered: BUF_LAT = 1. Drawn at P = 8. clk is not drawn.</text>
