<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 220" width="1130" height="220" font-family="Arial, Helvetica, sans-serif" fill="#000">
<title>smx_system</title>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L7.5,4 L0,7.2 z" fill="#000"/></marker></defs>
<rect width="1130" height="220" fill="#fff"/>
<rect x="240" y="30" width="760" height="170" fill="none" stroke="#000" stroke-width="1.2" stroke-dasharray="7 4"/>
<text x="248" y="192" font-size="11" text-anchor="start">FPGA system (implement team)</text>
<rect x="40" y="70" width="120" height="60" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="100" y="97" font-size="13" text-anchor="middle">PC</text>
<text x="100" y="113" font-size="11" text-anchor="middle">Python, System Console</text>
<rect x="280" y="70" width="140" height="60" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="350" y="97" font-size="13" text-anchor="middle">JTAG to Avalon</text>
<text x="350" y="113" font-size="11" text-anchor="middle">Master Bridge</text>
<rect x="540" y="70" width="130" height="60" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="605" y="97" font-size="13" text-anchor="middle">smx_avalon</text>
<text x="605" y="113" font-size="11" text-anchor="middle">thin wrapper</text>
<rect x="800" y="70" width="130" height="60" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="865" y="104" font-size="13" text-anchor="middle">smx_core</text>
<polyline points="160,100 280,100" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="165" y="95" font-size="11" text-anchor="start">USB-Blaster</text>
<polyline points="420,100 540,100" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="425" y="95" font-size="11" text-anchor="start">Avalon-MM, 32 bit</text>
<polyline points="670,100 800,100" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="675" y="95" font-size="11" text-anchor="start">acc_*, read latency 2</text>
<polyline points="930,80 1110,80" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="1010" y="75" font-size="11" text-anchor="start">status_busy</text>
<polyline points="930,100 1110,100" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="1010" y="95" font-size="11" text-anchor="start">status_done</text>
<polyline points="930,120 1110,120" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="1010" y="115" font-size="11" text-anchor="start">status_err</text>
<text x="680" y="170" font-size="11" text-anchor="start">status_* can drive LEDs; leaving them open has no effect.</text>
</svg>
